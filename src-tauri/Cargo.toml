[package]
name = "focus-bar"
version = "0.1.0"
description = "Focus Bar - Attention management overlay for AI coding"
authors = ["shamingming"]
edition = "2021"

[lib]
name = "focus_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "time"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
